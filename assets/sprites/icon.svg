<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <!-- Tower shape -->
  <polygon points="64,12 24,116 104,116" fill="none" stroke="#6ec6ff" stroke-width="3"/>
  <polygon points="64,30 36,116 92,116" fill="none" stroke="#6ec6ff" stroke-width="1.5" opacity="0.6"/>
  <polygon points="64,48 48,116 80,116" fill="none" stroke="#6ec6ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Core glow -->
  <circle cx="64" cy="80" r="8" fill="#ff6ec6" opacity="0.8"/>
  <!-- Orbit rings -->
  <ellipse cx="64" cy="60" rx="30" ry="8" fill="none" stroke="#6ec6ff" stroke-width="1" opacity="0.4" transform="rotate(-15,64,60)"/>
  <!-- Particles -->
  <circle cx="40" cy="45" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="88" cy="55" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="55" cy="25" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="80" cy="35" r="1.5" fill="#ff6ec6" opacity="0.5"/>
</svg>
